# Demo independente do HPA "documents": evita dois controladores no mesmo alvo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents-keda
  namespace: peakguard-p6
spec:
  replicas: 1
  selector:
    matchLabels: {app: documents-keda}
  template:
    metadata:
      labels: {app: documents-keda}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: documents
        image: peakguard-p6:local
        imagePullPolicy: Never
        ports: [{containerPort: 8080}]
        resources:
          requests: {cpu: 100m, memory: 32Mi}
          limits: {cpu: 500m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /health, port: 8080}
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: documents-keda
  namespace: peakguard-p6
spec:
  selector: {app: documents-keda}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: documents-keda
  namespace: peakguard-p6
spec:
  scaleTargetRef: {name: documents-keda}
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"
