# Testes do backend + checagem de reprodutibilidade dos benchmarks.
# Repo público: minutos gratuitos. Sem filtro de caminho, porque o job "test"
# é check obrigatório na main e precisa reportar em todo PR. Mantidos:
# concorrência (cancela execução antiga), rascunho ignorado, cache e timeout.
name: ci-python

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Sem o extra "llm": o teste do SDK OpenAI é pulado (importorskip).
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check -q ".[dev]"

      - name: Testes
        run: python -m pytest -q

      - name: Benchmarks reproduzíveis
        run: |
          python -m peakguard.benchmarks --output /tmp/bench > /dev/null
          diff -qr benchmarks/results /tmp/bench
